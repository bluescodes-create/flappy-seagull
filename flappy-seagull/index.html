<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Seagull - Weston-super-Mare Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            font-family: 'Press+Start+2P', monospace;
            background-color: #0f172a;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .pixel-art {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Custom Retro UI shadows & borders */
        .retro-box {
            background-color: #fef08a;
            border: 4px solid #451a03;
            box-shadow: inset -4px -4px 0px #ca8a04, inset 4px 4px 0px #fef9c3;
        }

        .retro-btn {
            background-color: #ea580c;
            border: 4px solid #fff;
            box-shadow: 0 4px 0 #7c2d12, inset -2px -2px 0 #9a3412, inset 2px 2px 0 #ff8c42;
            color: white;
            text-shadow: 2px 2px 0 #451a03;
            transition: transform 0.05s, box-shadow 0.05s;
        }

        .retro-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #7c2d12;
        }

        .retro-btn-green {
            background-color: #16a34a;
            box-shadow: 0 4px 0 #14532d, inset -2px -2px 0 #15803d, inset 2px 2px 0 #4ade80;
        }

        .retro-btn-green:active {
            box-shadow: 0 0 0 #14532d;
        }

        /* Canvas Wrapper */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 780px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-slate-950 text-white p-0 sm:p-4">

    <div id="game-container" class="relative overflow-hidden bg-sky-300 rounded-none sm:rounded-xl border-0 sm:border-4 border-slate-800">
        <!-- Game Canvas -->
        <canvas id="gameCanvas" class="w-full h-full block pixel-art"></canvas>

        <!-- UI Overlays -->
        
        <!-- Audio & Control Buttons Top Bar -->
        <div class="absolute top-3 left-3 right-3 flex justify-between items-center z-10 pointer-events-none">
            <div id="top-coin-counter" class="bg-amber-400 border-2 border-amber-900 px-3 py-1 rounded-full text-amber-950 text-xs flex items-center gap-1.5 shadow-md font-bold pointer-events-auto">
                🪙 <span id="coin-count-display">0</span>
            </div>
            <button id="mute-btn" class="pointer-events-auto bg-slate-900/80 hover:bg-slate-800 text-white border-2 border-white rounded-lg p-2 text-[10px] shadow-md tracking-wider">
                🔊 SFX
            </button>
        </div>

        <!-- START MENU OVERLAY -->
        <div id="start-menu" class="absolute inset-0 flex flex-col items-center justify-between py-10 px-4 bg-black/25 z-20">
            <div class="text-center mt-6">
                <h1 class="text-2xl sm:text-3xl font-black text-amber-300 drop-shadow-[0_4px_0_#000] tracking-wider uppercase leading-snug">
                    FLAPPY<br><span class="text-white text-3xl sm:text-4xl">SEAGULL</span>
                </h1>
                <p class="text-[9px] text-amber-100 mt-2 bg-slate-900/80 px-2.5 py-1 rounded border border-amber-300/40 tracking-wider">Weston-super-Mare Edition</p>
            </div>

            <!-- Bird Tap Helper Animation -->
            <div class="text-center my-auto flex flex-col items-center">
                <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center animate-bounce mb-2 border-2 border-dashed border-white">
                    <span class="text-2xl">👆</span>
                </div>
                <span class="text-[10px] text-white drop-shadow-[0_2px_0_#000]">TAP or SPACE TO FLAP</span>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col gap-3 w-full max-w-[240px] mb-4">
                <button id="start-btn" class="retro-btn retro-btn-green py-3 text-xs font-bold uppercase rounded tracking-wider">
                    PLAY GAME
                </button>
                <button id="shop-btn-start" class="retro-btn py-3 text-xs font-bold uppercase rounded tracking-wider flex items-center justify-center gap-2">
                    🛒 SHOP / SKINS
                </button>
            </div>
        </div>

        <!-- GAME OVER OVERLAY -->
        <div id="game-over-menu" class="absolute inset-0 flex flex-col items-center justify-center px-6 bg-black/50 z-20 hidden">
            <div class="retro-box w-full p-5 rounded-lg text-amber-950 flex flex-col items-center shadow-2xl relative">
                <h2 class="text-lg font-bold text-amber-950 mb-4 drop-shadow-[0_1px_0_#fff]">GAME OVER</h2>
                
                <div class="w-full bg-amber-100/90 border-2 border-amber-900 rounded p-3 mb-4 space-y-2 text-xs">
                    <div class="flex justify-between items-center">
                        <span class="text-amber-900">MEDAL:</span>
                        <div id="medal-icon" class="text-2xl">--</div>
                    </div>
                    <hr class="border-amber-900/30">
                    <div class="flex justify-between items-center">
                        <span class="text-amber-900">SCORE:</span>
                        <span id="final-score" class="text-lg font-bold text-amber-950">0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-amber-900">BEST:</span>
                        <span id="best-score" class="text-lg font-bold text-emerald-700">0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-amber-900">COINS:</span>
                        <span id="session-coins" class="text-sm font-bold text-amber-600">+0</span>
                    </div>
                </div>

                <div class="flex gap-2 w-full">
                    <button id="restart-btn" class="retro-btn retro-btn-green flex-1 py-3 text-[10px] font-bold uppercase rounded">
                        REPLAY
                    </button>
                    <button id="shop-btn-over" class="retro-btn flex-1 py-3 text-[10px] font-bold uppercase rounded">
                        SHOP
                    </button>
                </div>
            </div>
        </div>

        <!-- SHOP OVERLAY -->
        <div id="shop-menu" class="absolute inset-0 bg-slate-900/95 z-30 flex flex-col p-4 text-white hidden">
            <div class="flex justify-between items-center mb-4 border-b-2 border-slate-700 pb-2">
                <h2 class="text-sm font-bold text-amber-400">SKIN LOCKER</h2>
                <button id="close-shop-btn" class="text-red-400 hover:text-red-300 text-lg font-bold px-2">✕</button>
            </div>

            <!-- Coin Display -->
            <div class="bg-amber-500/20 border border-amber-500/50 rounded p-2 mb-4 flex justify-between items-center">
                <span class="text-[10px] text-amber-200">YOUR COINS:</span>
                <span class="text-amber-400 font-bold text-xs">🪙 <span id="shop-coin-display">0</span></span>
            </div>

            <!-- Skins List -->
            <div id="skins-container" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <!-- Skin cards generated via JS -->
            </div>
        </div>
    </div>

    <script>
        // --- AUDIO SYNTHESIZER (Web Audio API) ---
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playFlap() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(420, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(840, this.ctx.currentTime + 0.09);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.09);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.09);
            }

            playPoint() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08); // E5
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playCoin() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(987.77, this.ctx.currentTime); // B5
                osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08); // E6
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            playHit() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playDie() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        }

        const audio = new SoundFX();

        // --- SKINS CONFIGURATION ---
        const SKINS = {
            seagull: {
                id: 'seagull',
                name: 'Seagull',
                sub: 'Classic Weston Scavenger',
                price: 0,
                colorBody: '#F8FAFC',
                colorWing: '#94A3B8',
                colorBeak: '#F59E0B',
                eyeColor: '#000000',
                accessory: null
            },
            pigeon: {
                id: 'pigeon',
                name: 'Pigeon',
                sub: 'Pier Town Native',
                price: 15,
                colorBody: '#64748B',
                colorWing: '#334155',
                colorBeak: '#475569',
                eyeColor: '#EF4444',
                neckColor: '#A855F7',
                accessory: null
            },
            donut: {
                id: 'donut',
                name: 'Chip Seagull',
                sub: 'Holds Hot Beach Fry',
                price: 25,
                colorBody: '#F8FAFC',
                colorWing: '#CBD5E1',
                colorBeak: '#F59E0B',
                eyeColor: '#000000',
                accessory: 'chip'
            },
            royal: {
                id: 'royal',
                name: 'Royal Seagull',
                sub: 'King of Birnbeck',
                price: 40,
                colorBody: '#F8FAFC',
                colorWing: '#CBD5E1',
                colorBeak: '#F59E0B',
                eyeColor: '#000000',
                accessory: 'crown'
            },
            disco: {
                id: 'disco',
                name: 'Disco Pigeon',
                sub: 'Groovy Pier Vibes',
                price: 60,
                colorBody: '#EC4899',
                colorWing: '#8B5CF6',
                colorBeak: '#FBBF24',
                eyeColor: '#06B6D4',
                accessory: 'shades'
            }
        };

        // --- GAME ENGINE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // State variables
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let coinsCollectedSession = 0;
        let totalCoins = parseInt(localStorage.getItem('wsm_coins') || '0');
        let highScore = parseInt(localStorage.getItem('wsm_highscore') || '0');
        let unlockedSkins = JSON.parse(localStorage.getItem('wsm_unlocked_skins') || '["seagull"]');
        let currentSkinId = localStorage.getItem('wsm_current_skin') || 'seagull';

        // Physics constants
        const GRAVITY = 0.25;
        const FLAP_IMPULSE = -5.3;
        const PIPE_SPEED = 1.8;
        const PIPE_SPAWN_RATE = 105; // frames
        const PIPE_GAP = 125;

        let frameCount = 0;
        let parallaxOffset = 0;

        // Bird Object
        const bird = {
            x: 60,
            y: 250,
            w: 32,
            h: 24,
            velocity: 0,
            rotation: 0,
            wingFrame: 0,
            wingTimer: 0,

            reset() {
                this.y = canvas.height / 2 - 20;
                this.velocity = 0;
                this.rotation = 0;
            },

            flap() {
                this.velocity = FLAP_IMPULSE;
                audio.playFlap();
            },

            update() {
                this.velocity += GRAVITY;
                this.y += this.velocity;

                if (this.velocity < 0) {
                    this.rotation = Math.max(-0.4, this.rotation - 0.08);
                } else {
                    this.rotation = Math.min(1.2, this.rotation + 0.06);
                }

                this.wingTimer++;
                if (this.wingTimer % 6 === 0) {
                    this.wingFrame = (this.wingFrame + 1) % 3;
                }
            },

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                const skin = SKINS[currentSkinId] || SKINS.seagull;

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.fillRect(-12, 12, 24, 5);

                // Body
                ctx.fillStyle = skin.colorBody;
                ctx.fillRect(-12, -8, 22, 16);
                ctx.fillRect(-8, -12, 16, 20);

                // Neck tint (Pigeon feature)
                if (skin.neckColor) {
                    ctx.fillStyle = skin.neckColor;
                    ctx.fillRect(0, -6, 6, 8);
                }

                // Tail
                ctx.fillStyle = skin.colorWing;
                ctx.fillRect(-16, -4, 6, 8);

                // Wing animation
                ctx.fillStyle = skin.colorWing;
                if (this.wingFrame === 0) {
                    ctx.fillRect(-6, -16, 12, 10);
                } else if (this.wingFrame === 1) {
                    ctx.fillRect(-8, -2, 14, 8);
                } else {
                    ctx.fillRect(-6, 4, 12, 10);
                }

                // Eye
                ctx.fillStyle = skin.eyeColor;
                ctx.fillRect(4, -8, 3, 3);

                // Beak
                ctx.fillStyle = skin.colorBeak;
                ctx.fillRect(10, -4, 8, 5);

                // Accessories
                if (skin.accessory === 'chip') {
                    // Hot Golden French Fry in Beak
                    ctx.fillStyle = '#FBBF24';
                    ctx.fillRect(12, 1, 10, 3);
                    ctx.fillStyle = '#D97706';
                    ctx.fillRect(20, 2, 3, 3);
                } else if (skin.accessory === 'crown') {
                    // Crown
                    ctx.fillStyle = '#F59E0B';
                    ctx.fillRect(2, -18, 10, 6);
                    ctx.fillRect(0, -18, 2, 2);
                    ctx.fillRect(6, -18, 2, 2);
                    ctx.fillRect(12, -18, 2, 2);
                    ctx.fillStyle = '#EF4444';
                    ctx.fillRect(6, -15, 2, 2);
                } else if (skin.accessory === 'shades') {
                    // Sunglasses
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(2, -9, 9, 5);
                    ctx.fillStyle = '#06B6D4';
                    ctx.fillRect(3, -8, 3, 2);
                }

                ctx.restore();
            }
        };

        // Pipe Management
        let pipes = [];
        let coins = [];

        class Pipe {
            constructor() {
                this.x = canvas.width;
                this.topHeight = Math.floor(Math.random() * (canvas.height - PIPE_GAP - 180)) + 40;
                this.bottomY = this.topHeight + PIPE_GAP;
                this.width = 52;
                this.passed = false;
            }

            update() {
                this.x -= PIPE_SPEED;
            }

            draw() {
                const drawPipeSegment = (x, y, w, h, isTop) => {
                    ctx.fillStyle = '#74C043';
                    ctx.fillRect(x, y, w, h);

                    ctx.fillStyle = '#98E063';
                    ctx.fillRect(x + 4, y, 6, h);

                    ctx.fillStyle = '#528B2B';
                    ctx.fillRect(x + w - 8, y, 6, h);

                    ctx.strokeStyle = '#2D4C18';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x, y, w, h);

                    const capH = 22;
                    const capY = isTop ? y + h - capH : y;
                    ctx.fillStyle = '#74C043';
                    ctx.fillRect(x - 4, capY, w + 8, capH);
                    ctx.fillStyle = '#98E063';
                    ctx.fillRect(x, capY, 6, capH);
                    ctx.fillStyle = '#528B2B';
                    ctx.fillRect(x + w - 4, capY, 6, capH);
                    ctx.strokeRect(x - 4, capY, w + 8, capH);
                };

                drawPipeSegment(this.x, 0, this.width, this.topHeight, true);
                drawPipeSegment(this.x, this.bottomY, this.width, canvas.height - this.bottomY - 80, false);
            }
        }

        class Coin {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 9;
                this.collected = false;
                this.animAngle = Math.random() * Math.PI;
            }

            update() {
                this.x -= PIPE_SPEED;
                this.animAngle += 0.08;
            }

            draw() {
                if (this.collected) return;
                ctx.save();
                ctx.translate(this.x, this.y);

                const bob = Math.sin(this.animAngle) * 3;

                ctx.fillStyle = '#F59E0B';
                ctx.beginPath();
                ctx.arc(0, bob, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#FCD34D';
                ctx.beginPath();
                ctx.arc(-2, bob - 2, this.radius - 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#78350F';
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('£', 0, bob + 1);

                ctx.restore();
            }
        }

        // --- WESTON-SUPER-MARE PHOTO-ACCURATE LANDMARKS ---
        const landmarkCanvases = {};

        // Helper to draw realistic Union Jack
        function drawUnionJack(lx, x, y, w, h) {
            lx.fillStyle = '#012169'; // Blue
            lx.fillRect(x, y, w, h);
            
            lx.strokeStyle = '#FFFFFF';
            lx.lineWidth = Math.max(2, h * 0.22);
            lx.beginPath();
            lx.moveTo(x, y); lx.lineTo(x + w, y + h);
            lx.moveTo(x + w, y); lx.lineTo(x, y + h);
            lx.stroke();

            lx.strokeStyle = '#C8102E'; // Red Crosses
            lx.lineWidth = Math.max(1, h * 0.12);
            lx.beginPath();
            lx.moveTo(x, y); lx.lineTo(x + w, y + h);
            lx.moveTo(x + w, y); lx.lineTo(x, y + h);
            lx.stroke();

            // Main St George's Cross
            lx.fillStyle = '#FFFFFF';
            lx.fillRect(x + w * 0.38, y, w * 0.24, h);
            lx.fillRect(x, y + h * 0.35, w, h * 0.3);

            lx.fillStyle = '#C8102E';
            lx.fillRect(x + w * 0.42, y, w * 0.16, h);
            lx.fillRect(x, y + h * 0.4, w, h * 0.2);
        }

        function preRenderLandmarks() {
            // 1. GRAND PIER (Image 1 Ref: White entrance building, turrets, bold red "GRAND PIER" text, blue stripes, kiosk awnings)
            {
                const w = 600, h = 320;
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                const lx = c.getContext('2d');
                lx.imageSmoothingEnabled = false;

                // Main Entrance Structure (White / Cream)
                lx.fillStyle = '#F8FAFC';
                lx.fillRect(50, 100, 500, 200);

                // Light Blue Vertical Stripe Accent Columns (matching image 1)
                lx.fillStyle = '#7DD3FC';
                lx.fillRect(50, 100, 45, 200);
                lx.fillRect(190, 100, 30, 200);
                lx.fillRect(380, 100, 30, 200);
                lx.fillRect(505, 100, 45, 200);

                // Horizontal Blue Trim Bands
                lx.fillStyle = '#0284C7';
                lx.fillRect(50, 100, 500, 6);
                lx.fillRect(50, 140, 500, 6);

                // Side Octagonal Turrets (Left & Right Domes)
                const drawTurret = (tx) => {
                    // Octagonal Tower Base
                    lx.fillStyle = '#F8FAFC';
                    lx.fillRect(tx, 30, 80, 70);
                    lx.fillStyle = '#7DD3FC';
                    lx.fillRect(tx + 5, 30, 15, 70);
                    lx.fillRect(tx + 60, 30, 15, 70);

                    // Arched Blue Windows
                    lx.fillStyle = '#0369A1';
                    lx.fillRect(tx + 30, 50, 20, 30);
                    lx.beginPath();
                    lx.arc(tx + 40, 50, 10, Math.PI, 0);
                    lx.fill();

                    // Soft Silver/Gray Dome Roof
                    lx.fillStyle = '#94A3B8';
                    lx.beginPath();
                    lx.arc(tx + 40, 30, 42, Math.PI, 0);
                    lx.fill();
                    lx.fillStyle = '#CBD5E1';
                    lx.beginPath();
                    lx.arc(tx + 40, 30, 36, Math.PI, 0);
                    lx.fill();

                    // Flag Pole
                    lx.fillStyle = '#64748B';
                    lx.fillRect(tx + 39, -5, 3, 35);
                    drawUnionJack(lx, tx + 42, -5, 22, 14);
                };

                drawTurret(65);
                drawTurret(455);

                // Center Roof Stepped Arch / Pediment
                lx.fillStyle = '#F8FAFC';
                lx.fillRect(200, 60, 200, 40);
                lx.fillStyle = '#0284C7';
                lx.fillRect(200, 60, 200, 5);

                // Center Flag Pole
                lx.fillStyle = '#64748B';
                lx.fillRect(298, 10, 4, 50);
                drawUnionJack(lx, 302, 10, 28, 18);

                // BOLD RED "GRAND PIER" TEXT FASCIA
                lx.fillStyle = '#EF4444'; // Red Fill
                lx.strokeStyle = '#FBBF24'; // Yellow Outline
                lx.lineWidth = 3;
                lx.font = '900 32px sans-serif';
                lx.textAlign = 'center';
                lx.strokeText('GRAND PIER', 300, 132);
                lx.fillText('GRAND PIER', 300, 132);

                // Entrance Portal Cutout (Walkway into pier)
                lx.fillStyle = '#1E293B';
                lx.fillRect(230, 210, 140, 90);

                // Kiosk Windows with Red/White Striped Awnings ("ICE CREAM" / "FISH & CHIPS")
                const drawKiosk = (kx, text) => {
                    lx.fillStyle = '#0284C7';
                    lx.fillRect(kx, 220, 90, 60);
                    lx.fillStyle = '#E0F2FE';
                    lx.fillRect(kx + 10, 230, 70, 40);

                    // Red/White Awnings
                    for (let stripe = 0; stripe < 90; stripe += 15) {

            // 2. BIRNBECK PIER (Image 2 Ref: Ultra-wide dark wooden trestle piles, rusty iron lattice, lifeboat slipway, island clock tower)
            {

                lx.beginPath();

            // 3. WINTER GARDENS PAVILION (Image 3 Ref: Wide crescent ivory stone, arched windows with curtain shading, "WINTER GARDENS PAVILION" arc)
            {
                const w = 800, h = 320;
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                const lx = c.getContext('2d');
                lx.imageSmoothingEnabled = false;

                // Ivory / Warm Cream Stone Base
                lx.fillStyle = '#FEFCE8';

                lx.fillRect(20, 270, 760, 6);

                // Crescent Row of Tall Arched Windows with Golden Interior Curtains
                const numWindows = 9;

                for (let i = 0; i < numWindows; i++) {
                    const wx = startX + i * spacing;

                    // Arched Opening
                    lx.fillStyle = '#1E293B';

                    lx.fillRect(wx + 4, wy + 10, ww - 8, wh - 10);
                    lx.fillStyle = '#EAB308';
                    lx.fillRect(wx + 10, wy + 15, ww - 20, wh - 15);

                    // White Lattice Window Grids
                    lx.strokeStyle = '#FFFFFF';
                    lx.lineWidth = 1.5;
                    lx.strokeRect(wx, wy, ww, wh);
                    lx.beginPath();
                    lx.arc(wx + ww / 2, wy, ww / 2, Math.PI, 0);
                    lx.moveTo(wx + ww / 2, wy - ww / 2); lx.lineTo(wx + ww / 2, wy + wh);
                    lx.moveTo(wx, wy + 35); lx.lineTo(wx + ww, wy + 35);

                    lx.fillStyle = '#FFFFFF';
                    lx.fillRect(wx - 14, wy - 20, 10, wh + 40);
                    lx.fillStyle = '#E2E8F0';
                    lx.fillRect(wx - 16, wy - 25, 14, 8); // Capital
                    lx.fillRect(wx - 16, wy + wh + 15, 14, 8); // Base
                }

                // Final rightmost column
                lx.fillStyle = '#FFFFFF';
                lx.fillRect(startX + numWindows * spacing - 14, 130, 10, 150);

                // Curved Roof Upper Parapet Fascia
                lx.fillStyle = '#FEFCE8';
                lx.fillRect(50, 85, 700, 40);
                lx.fillStyle = '#E2E8F0';
                lx.fillRect(50, 85, 700, 6);
                lx.fillRect(50, 120, 700, 6);

                // PROMINENT SERIF TEXT "WINTER GARDENS PAVILION" ALONG ARC
                lx.fillStyle = '#1E293B';
                lx.font = '900 18px serif';
                lx.textAlign = 'center';
                lx.fillText('WINTER   GARDENS   PAVILION', 400, 110);

                // Wing Extensions (Left and Right)
                lx.fillStyle = '#FEFCE8';
                lx.fillRect(10, 150, 80, 130);
                lx.fillRect(710, 150, 80, 130);

                landmarkCanvases['winterGardens'] = { canvas: c, w, h };
            }

            // 4. THE SOVEREIGN CENTRE (Image 4 Ref: Buff stone masonry, central blue glass atrium with yellow sunburst, diamond portico)
            {
                const w = 650, h = 380;
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                const lx = c.getContext('2d');
                lx.imageSmoothingEnabled = false;

                // Buff / Beige Sandstone Masonry Facade
                lx.fillStyle = '#D97706'; // Base warm tone
                lx.fillRect(40, 70, 570, 280);
                lx.fillStyle = '#FEF3C7'; // Sandstone Block face
                lx.fillRect(50, 80, 220, 260);
                lx.fillRect(380, 80, 220, 260);

                // Block Cutout Lines
                lx.fillStyle = '#D97706';
                for (let y = 80; y < 340; y += 24) {
                    lx.fillRect(50, y, 220, 2);
                    lx.fillRect(380, y, 220, 2);
                }

                // Window Recesses
                lx.fillStyle = '#0F172A';
                lx.fillRect(80, 110, 60, 80);
                lx.fillRect(170, 110, 60, 80);
                lx.fillRect(410, 110, 60, 80);
                lx.fillRect(500, 110, 60, 80);

                // Ground Level Dark Blue Arches ("BURGER KING", "wilko")
                for (let ax = 50; ax <= 210; ax += 80) {
                    lx.fillStyle = '#0F172A';
                    lx.beginPath();
                    lx.arc(ax + 30, 280, 30, Math.PI, 0);
                    lx.fillRect(ax, 280, 60, 60);
                    lx.fill();
                }
                for (let ax = 380; ax <= 540; ax += 80) {
                    lx.fillStyle = '#0F172A';
                    lx.beginPath();
                    lx.arc(ax + 30, 280, 30, Math.PI, 0);
                    lx.fillRect(ax, 280, 60, 60);
                    lx.fill();
                }

                // Shop Banners
                lx.fillStyle = '#DC2626'; // Burger King Red
                lx.fillRect(60, 300, 50, 15);
                lx.fillStyle = '#BE123C'; // Wilko Magenta/Red
                lx.fillRect(430, 300, 50, 15);

                // CENTRAL GRAND ARCH GLASS ATRIUM WITH SUNBURST (Photo 4)
                lx.fillStyle = '#0284C7'; // Blue Glass
                lx.beginPath();
                lx.arc(325, 140, 55, Math.PI, 0);
                lx.fillRect(270, 140, 110, 120);
                lx.fill();

                // Dark Blue Metal Framing
                lx.strokeStyle = '#1E3A8A';
                lx.lineWidth = 4;
                lx.stroke();

                // Yellow Sunburst Artwork inside Atrium Dome
                lx.fillStyle = '#F59E0B';
                lx.beginPath();
                lx.arc(325, 140, 22, 0, Math.PI * 2);
                lx.fill();
                // Sun Rays
                lx.strokeStyle = '#FBBF24';
                lx.lineWidth = 3;
                for (let angle = 0; angle < Math.PI * 2; angle += 0.5) {
                    lx.beginPath();
                    lx.moveTo(325, 140);
                    lx.lineTo(325 + Math.cos(angle) * 48, 140 + Math.sin(angle) * 48);
                    lx.stroke();
                }

                // ROTUNDA ENTRANCE PORTICO WITH HARLEQUIN DIAMOND PILLARS
                lx.fillStyle = '#F8FAFC'; // Rotunda canopy Header
                lx.fillRect(230, 200, 190, 35);
                lx.fillStyle = '#1E293B';
                lx.font = '900 11px sans-serif';
                lx.textAlign = 'center';
                lx.fillText('SOVEREIGN', 325, 222);

                // Diamond Harlequin Pattern Pillars (Teal, Blue, White - Photo 4)
                const pillarXs = [245, 290, 360, 405];
                pillarXs.forEach(px => {
                    lx.fillStyle = '#F8FAFC';
                    lx.fillRect(px, 235, 14, 110);

                    // Teal & Black Diamonds
                    for (let dy = 235; dy < 340; dy += 16) {
                        lx.fillStyle = (dy / 16) % 2 === 0 ? '#0D9488' : '#0F172A';
                        lx.beginPath();
                        lx.moveTo(px + 7, dy);
                        lx.lineTo(px + 14, dy + 8);
                        lx.lineTo(px + 7, dy + 16);

                landmarkCanvases['sovereign'] = { canvas: c, w, h };

        }

        function drawWestonBackground() {
            if (!landmarkCanvases.grandPier) {
                preRenderLandmarks();
            }

            // Sky Gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#38BDF8');
            skyGrad.addColorStop(0.65, '#BAE6FD');
            skyGrad.addColorStop(0.85, '#FEF08A'); // Warm Coast Horizon
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sun
            ctx.fillStyle = '#FEF08A';
            ctx.fillRect(canvas.width - 75, 25, 38, 38);

            // Parallax Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            const cloudOffset = (parallaxOffset * 0.25) % (canvas.width + 140);
            ctx.fillRect(120 - cloudOffset, 35, 50, 16);
            ctx.fillRect(130 - cloudOffset, 27, 30, 24);

            ctx.fillRect(320 - cloudOffset, 65, 65, 18);
            ctx.fillRect(340 - cloudOffset, 55, 30, 26);

            // SCROLLING LANDMARKS LAYER
            const groundY = canvas.height - 80;
            const sequence = ['grandPier', 'birnbeck', 'winterGardens', 'sovereign'];
            const spacing = 120; // Distance between landmarks

            // Calculate total sequence loop width dynamically based on variable canvas widths
            let totalSequenceWidth = 0;
            sequence.forEach(key => {
                totalSequenceWidth += (landmarkCanvases[key].w * 0.7) + spacing;
            });

            const scrollX = -(parallaxOffset * 0.65) % totalSequenceWidth;

            ctx.save();
            for (let loopPass = 0; loopPass < 2; loopPass++) {
                let currentX = scrollX + (loopPass * totalSequenceWidth);

                sequence.forEach(key => {
                    const lm = landmarkCanvases[key];
                    const scaledW = lm.w * 0.68;
                    const scaledH = lm.h * 0.68;
                    const drawY = groundY - scaledH + 12;

                    if (currentX + scaledW > -100 && currentX < canvas.width + 100) {
                        ctx.drawImage(lm.canvas, 0, 0, lm.w, lm.h, currentX, drawY, scaledW, scaledH);
                    }

                    currentX += scaledW + spacing;
                });
            }
            ctx.restore();

            // SEA & WESTON BAY SHORELINE
            const seaY = groundY - 18;
            ctx.fillStyle = '#0284C7'; // Muddy / Channel Sea Water
            ctx.fillRect(0, seaY, canvas.width, 18);

            // Animated Waves
            ctx.fillStyle = '#BAE6FD';
            const waveX = (parallaxOffset * 1.5) % 30;
            for (let w = -30; w < canvas.width + 30; w += 20) {
                ctx.fillRect(w - waveX, seaY + 4, 10, 2);
            }

            // Mud / Sandy Beach Strip
            ctx.fillStyle = '#D97706';
            ctx.fillRect(0, groundY - 4, canvas.width, 4);

            // PROMENADE PAVEMENT (Fast Parallax Ground)
            ctx.fillStyle = '#fef08a';
            ctx.fillRect(0, groundY, canvas.width, 80);

            // Curb Border
            ctx.fillStyle = '#451a03';
            ctx.fillRect(0, groundY, canvas.width, 8);
            ctx.fillStyle = '#16a34a';
            ctx.fillRect(0, groundY + 3, canvas.width, 3);

            // Moving Pavement Diagonal Patterns
            ctx.fillStyle = '#ca8a04';
            const groundPatternX = (parallaxOffset * PIPE_SPEED) % 24;
            for (let p = -24; p < canvas.width + 24; p += 24) {
                ctx.beginPath();
                ctx.moveTo(p - groundPatternX, groundY + 8);
                ctx.lineTo(p - groundPatternX - 12, canvas.height);
                ctx.lineTo(p - groundPatternX - 6, canvas.height);
                ctx.lineTo(p - groundPatternX + 6, groundY + 8);
                ctx.fill();
            }
        }

        // --- GAME LOGIC & LOOPS ---

        function resizeCanvas() {
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            bird.x = Math.floor(canvas.width * 0.22);
        }

        function initGame() {
            resizeCanvas();
            bird.reset();
            pipes = [];
            coins = [];
            score = 0;
            coinsCollectedSession = 0;
            frameCount = 0;
            updateUI();
        }

        function checkCollisions() {
            const bR = bird.x + 10;
            const bL = bird.x - 10;
            const bT = bird.y - 10;
            const bB = bird.y + 10;

            const groundY = canvas.height - 80;

            if (bB >= groundY || bT <= 0) {
                return true;
            }

            for (let p of pipes) {
                if (bR > p.x && bL < p.x + p.width) {
                    if (bT < p.topHeight || bB > p.bottomY) {
                        return true;
                    }
                }
            }

            return false;
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            audio.playHit();
            setTimeout(() => audio.playDie(), 150);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('wsm_highscore', highScore.toString());
            }

            totalCoins += coinsCollectedSession;
            localStorage.setItem('wsm_coins', totalCoins.toString());

            document.getElementById('final-score').innerText = score;
            document.getElementById('best-score').innerText = highScore;
            document.getElementById('session-coins').innerText = '+' + coinsCollectedSession;

            const medalElem = document.getElementById('medal-icon');
            if (score >= 40) medalElem.innerText = '💎';
            else if (score >= 25) medalElem.innerText = '🥇';
            else if (score >= 10) medalElem.innerText = '🥈';
            else if (score >= 5) medalElem.innerText = '🥉';
            else medalElem.innerText = '🔒';

            document.getElementById('game-over-menu').classList.remove('hidden');
            updateUI();
        }

        function update() {
            if (gameState === 'PLAYING') {
                parallaxOffset += 1;
                frameCount++;

                bird.update();

                if (frameCount % PIPE_SPAWN_RATE === 0) {
                    const newPipe = new Pipe();
                    pipes.push(newPipe);

                    if (Math.random() < 0.6) {
                        coins.push(new Coin(newPipe.x + newPipe.width / 2, newPipe.topHeight + PIPE_GAP / 2));
                    }
                }

                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].update();

                    if (!pipes[i].passed && pipes[i].x + pipes[i].width < bird.x) {
                        pipes[i].passed = true;
                        score++;
                        audio.playPoint();
                    }

                    if (pipes[i].x + pipes[i].width < -20) {
                        pipes.splice(i, 1);
                    }
                }

                for (let i = coins.length - 1; i >= 0; i--) {
                    coins[i].update();

                    if (!coins[i].collected) {
                        const dist = Math.hypot(bird.x - coins[i].x, bird.y - coins[i].y);
                        if (dist < 22) {
                            coins[i].collected = true;
                            coinsCollectedSession++;
                            audio.playCoin();
                            updateUI();
                        }
                    }

                    if (coins[i].x < -20) {
                        coins.splice(i, 1);
                    }
                }

                if (checkCollisions()) {
                    triggerGameOver();
                }
            } else if (gameState === 'START') {
                parallaxOffset += 0.5;
                bird.y = (canvas.height / 2 - 20) + Math.sin(Date.now() / 200) * 6;
            }
        }

        function drawScore() {
            if (gameState !== 'PLAYING') return;

            ctx.save();
            ctx.fillStyle = '#FFFFFF';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 5;
            ctx.font = '900 30px "Press Start 2P", monospace';
            ctx.textAlign = 'center';
            ctx.strokeText(score, canvas.width / 2, 70);
            ctx.fillText(score, canvas.width / 2, 70);
            ctx.restore();
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawWestonBackground();

            pipes.forEach(p => p.draw());
            coins.forEach(c => c.draw());

            bird.draw();

            drawScore();

            update();
            requestAnimationFrame(loop);
        }

        // --- SHOP & LOCKER UI SYSTEM ---
        function renderShop() {
            const container = document.getElementById('skins-container');
            container.innerHTML = '';

            document.getElementById('shop-coin-display').innerText = totalCoins;

            Object.keys(SKINS).forEach(id => {
                const skin = SKINS[id];
                const isUnlocked = unlockedSkins.includes(id);
                const isSelected = currentSkinId === id;

                const card = document.createElement('div');
                card.className = `p-3 rounded-lg border-2 flex items-center justify-between transition ${
                    isSelected ? 'bg-amber-500/30 border-amber-400' : 'bg-slate-800/80 border-slate-700'
                }`;

                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-slate-900 border border-slate-700 rounded flex items-center justify-center text-lg">
                            ${id === 'seagull' ? '🕊️' : id === 'pigeon' ? '🐦' : id === 'donut' ? '🍟' : id === 'royal' ? '👑' : '🪩'}
                        </div>
                        <div>
                            <div class="text-[11px] font-bold text-amber-300">${skin.name}</div>
                            <div class="text-[8px] text-slate-400">${skin.sub}</div>
                        </div>
                    </div>
                    <div>
                        ${
                            isSelected
                                ? `<span class="text-[9px] bg-emerald-600 text-white px-2 py-1 rounded font-bold">EQUIPPED</span>`
                                : isUnlocked
                                ? `<button onclick="equipSkin('${id}')" class="retro-btn retro-btn-green text-[9px] px-3 py-1.5 rounded">EQUIP</button>`
                                : `<button onclick="buySkin('${id}')" class="retro-btn text-[9px] px-3 py-1.5 rounded flex items-center gap-1">
                                    <span>🪙 ${skin.price}</span>
                                   </button>`
                        }
                    </div>
                `;

                container.appendChild(card);
            });
        }

        window.equipSkin = function(id) {
            currentSkinId = id;
            localStorage.setItem('wsm_current_skin', currentSkinId);
            renderShop();
        };

        window.buySkin = function(id) {
            const skin = SKINS[id];
            if (totalCoins >= skin.price) {
                totalCoins -= skin.price;
                unlockedSkins.push(id);
                currentSkinId = id;

                localStorage.setItem('wsm_coins', totalCoins.toString());
                localStorage.setItem('wsm_unlocked_skins', JSON.stringify(unlockedSkins));
                localStorage.setItem('wsm_current_skin', currentSkinId);

                audio.playCoin();
                updateUI();
                renderShop();
            } else {
                audio.playHit();
            }
        };

        function updateUI() {
            document.getElementById('coin-count-display').innerText = totalCoins + coinsCollectedSession;
        }

        // --- CONTROLS & EVENT LISTENERS ---
        function handleFlapInput(e) {
            if (e && e.type === 'keydown' && e.code !== 'Space' && e.code !== 'ArrowUp') return;

            audio.init();

            if (gameState === 'PLAYING') {
                bird.flap();
            } else if (gameState === 'START') {
                document.getElementById('start-menu').classList.add('hidden');
                gameState = 'PLAYING';
                bird.flap();
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            if (gameState === 'PLAYING') handleFlapInput(e);
        });
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                handleFlapInput(e);
            }
        });
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleFlapInput(e);
        }, { passive: false });

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.init();
            document.getElementById('start-menu').classList.add('hidden');
            initGame();
            gameState = 'PLAYING';
            bird.flap();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            document.getElementById('game-over-menu').classList.add('hidden');
            initGame();
            gameState = 'PLAYING';
            bird.flap();
        });

        const openShop = () => {
            renderShop();
            document.getElementById('shop-menu').classList.remove('hidden');
        };
        document.getElementById('shop-btn-start').addEventListener('click', openShop);
        document.getElementById('shop-btn-over').addEventListener('click', openShop);
        document.getElementById('close-shop-btn').addEventListener('click', () => {
            document.getElementById('shop-menu').classList.add('hidden');
        });

        const muteBtn = document.getElementById('mute-btn');
        muteBtn.addEventListener('click', () => {
            audio.muted = !audio.muted;
            muteBtn.innerText = audio.muted ? '🔇 MUTED' : '🔊 SFX';
            muteBtn.classList.toggle('bg-red-900', audio.muted);
        });

        window.addEventListener('resize', resizeCanvas);

        window.onload = () => {
            initGame();
            loop();
        };
    </script>
